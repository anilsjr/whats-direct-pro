name: whatsapp_direct_pro
description: Open WhatsApp chats without saving contacts.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  country_picker: 2.0.27
  phone_numbers_parser: 9.0.28
  google_mobile_ads: ^8.0.0
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/logo.jpg
  remove_alpha_ios: true

